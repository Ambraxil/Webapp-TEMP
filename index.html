<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glyph</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <h1>GLYPH</h1>
      </header>

      <main class="gallery">
        <button class="nav prev" aria-label="Previous">‹</button>

        <div class="preview" aria-label="Image preview">
          <span>[ Image Preview ]</span>
        </div>

        <button class="nav next" aria-label="Next">›</button>
      </main>

      <section class="cards">
        <article class="card">
          <h2>ORIGINAL TEXT</h2>
          <p>Bonjour le monde, ceci est un exemple de texte à traduire.</p>
        </article>

        <article class="card">
          <h2>TRANSLATED TEXT</h2>
          <p>Hello world, this is an example of text to translate.</p>
        </article>
      </section>
    </div>
  </body>
</html>
